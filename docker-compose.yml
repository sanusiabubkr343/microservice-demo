services:

  # ========== Databases ==========
  mysql-accounts:
    image: mysql:8.0
    container_name: mysql-accounts
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: accounts_db
    ports:
      - "3306:3306"
    volumes:
      - accounts-data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-proot"]
      interval: 10s
      timeout: 5s
      retries: 5

  mysql-loans:
    image: mysql:8.0
    container_name: mysql-loans
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: loans_db
    ports:
      - "3307:3306"
    volumes:
      - loans-data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-proot"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ========== Service Registry ==========
  eureka-server:
    build: ./eureka-server
    container_name: eureka-server
    ports:
      - "8761:8761"

  # ========== Accounts Service ==========
  accounts-service:
    build: ./accounts-service
    container_name: accounts-service
    depends_on:
      mysql-accounts:
        condition: service_healthy
      eureka-server:
        condition: service_started
    environment:
      SPRING_DATASOURCE_URL: jdbc:mysql://mysql-accounts:3306/accounts_db?useSSL=false&allowPublicKeyRetrieval=true
      SPRING_DATASOURCE_USERNAME: root
      SPRING_DATASOURCE_PASSWORD: root
      EUREKA_CLIENT_SERVICEURL_DEFAULTZONE: http://eureka-server:8761/eureka
    ports:
      - "8081:8081"

  # ========== Loans Service ==========
  loans-service:
    build: ./loans-service
    container_name: loans-service
    depends_on:
      mysql-loans:
        condition: service_healthy
      eureka-server:
        condition: service_started
    environment:
      SPRING_DATASOURCE_URL: jdbc:mysql://mysql-loans:3306/loans_db?useSSL=false&allowPublicKeyRetrieval=true
      SPRING_DATASOURCE_USERNAME: root
      SPRING_DATASOURCE_PASSWORD: root
      EUREKA_CLIENT_SERVICEURL_DEFAULTZONE: http://eureka-server:8761/eureka
    ports:
      - "8082:8082"

  # ========== Gateway ==========
  gateway-service:
    build: ./gateway-service
    container_name: gateway-service
    depends_on:
      - eureka-server
      - accounts-service
      - loans-service
    environment:
      EUREKA_CLIENT_SERVICEURL_DEFAULTZONE: http://eureka-server:8761/eureka
    ports:
      - "8080:8080"

volumes:
  accounts-data:
  loans-data: