server:
  port: 8082

spring:
  application:
    name: loans-service
  datasource:
    url: jdbc:mysql://localhost:3307/loans_db?useSSL=false&allowPublicKeyRetrieval=true
    username: root
    password: root
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true

eureka:
  client:
    service-url:
      defaultZone: http://localhost:8761/eureka
  instance:
    prefer-ip-address: true